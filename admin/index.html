<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админ-панель · Pro Mebel</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ===== Экран входа ===== -->
  <div id="login-screen" class="wrap" style="max-width:380px;">
    <div class="brand">
      <div class="brand__mark"></div>
      <div>
        <div class="brand__name">Pro Mebel</div>
        <div class="brand__tag">Админ-панель отзывов</div>
      </div>
    </div>
    <div class="edgeband"></div>
    <div class="card">
      <div class="section-label" style="margin-top:0;">Вход</div>
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@promebel.tj" style="margin-bottom:12px;">
      <label>Пароль</label>
      <input type="password" id="login-password" placeholder="••••••••" style="margin-bottom:16px;">
      <button class="btn btn--primary" id="login-btn">Войти</button>
      <div class="error-text" id="login-error"></div>
    </div>
  </div>

  <!-- ===== Приложение ===== -->
  <div id="app-screen" class="admin-app" style="display:none;">
    <header class="admin-header">
      <div class="brand">
        <div class="brand__mark"></div>
        <div>
          <div class="brand__name">Pro Mebel</div>
          <div class="brand__tag">Админ-панель</div>
        </div>
      </div>
      <nav class="admin-tabs">
        <button class="admin-tab is-active" data-tab="employees">Сотрудники</button>
        <button class="admin-tab" data-tab="reviews">Отзывы</button>
        <button class="admin-tab" data-tab="analytics">Аналитика</button>
      </nav>
      <button class="btn btn--ghost" id="logout-btn" style="width:auto;padding:8px 14px;">Выйти</button>
    </header>

    <main class="admin-main">

      <!-- ---------- Сотрудники ---------- -->
      <section id="tab-employees" class="admin-tab-panel">
        <div class="admin-panel-head">
          <h2>Сотрудники</h2>
          <button class="btn btn--primary" id="add-employee-btn" style="width:auto;padding:10px 16px;">+ Добавить сотрудника</button>
        </div>
        <div class="table-wrap">
          <table class="admin-table" id="employees-table">
            <thead>
              <tr>
                <th>Имя</th><th>Роль</th><th>Филиал</th><th>Ср. оценка</th><th>Отзывов</th><th>Статус</th><th></th>
              </tr>
            </thead>
            <tbody id="employees-tbody">
              <tr><td colspan="7" class="hint">Загрузка…</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- ---------- Отзывы ---------- -->
      <section id="tab-reviews" class="admin-tab-panel" style="display:none;">
        <div class="admin-panel-head">
          <h2>Отзывы</h2>
        </div>
        <div class="filters">
          <select id="filter-employee"><option value="">Все сотрудники</option></select>
          <select id="filter-branch">
            <option value="">Все филиалы</option>
            <option value="khujand">Худжанд</option>
            <option value="dushanbe">Душанбе</option>
          </select>
          <select id="filter-period">
            <option value="">Весь период</option>
            <option value="7">7 дней</option>
            <option value="30">30 дней</option>
            <option value="90">90 дней</option>
          </select>
          <label style="display:flex;align-items:center;gap:6px;">
            <input type="checkbox" id="filter-flagged" style="width:auto;">
            Только подозрительные
          </label>
        </div>
        <div class="table-wrap">
          <table class="admin-table" id="reviews-table">
            <thead>
              <tr><th>Дата</th><th>Сотрудник</th><th>Филиал</th><th>Оценка</th><th>Комментарий</th><th>Флаг</th></tr>
            </thead>
            <tbody id="reviews-tbody">
              <tr><td colspan="6" class="hint">Загрузка…</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- ---------- Аналитика ---------- -->
      <section id="tab-analytics" class="admin-tab-panel" style="display:none;">
        <div class="admin-panel-head"><h2>Аналитика</h2></div>
        <div class="analytics-grid">
          <div class="card">
            <div class="section-label" style="margin-top:0;">Средняя оценка по сотрудникам</div>
            <canvas id="chart-by-employee" height="220"></canvas>
          </div>
          <div class="card">
            <div class="section-label" style="margin-top:0;">Динамика среднего рейтинга (30 дней)</div>
            <canvas id="chart-trend" height="220"></canvas>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- ===== Модалка: добавить/редактировать сотрудника ===== -->
  <div id="employee-modal" class="modal-overlay" style="display:none;">
    <div class="modal card">
      <div class="section-label" style="margin-top:0;" id="employee-modal-title">Новый сотрудник</div>
      <label>Имя и фамилия</label>
      <input type="text" id="employee-name" placeholder="Иван Иванов" style="margin-bottom:12px;">
      <label>Роль</label>
      <select id="employee-role" style="margin-bottom:12px;">
        <option value="manager">Менеджер</option>
        <option value="consultant">Консультант</option>
        <option value="other">Другое</option>
      </select>
      <label>Филиал</label>
      <select id="employee-branch" style="margin-bottom:12px;">
        <option value="khujand">Худжанд</option>
        <option value="dushanbe">Душанбе</option>
      </select>
      <div class="error-text" id="employee-modal-error"></div>
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button class="btn btn--ghost" id="employee-modal-cancel">Отмена</button>
        <button class="btn btn--primary" id="employee-modal-save">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- ===== Модалка: QR-код ===== -->
  <div id="qr-modal" class="modal-overlay" style="display:none;">
    <div class="modal card" style="text-align:center;">
      <div class="section-label" style="margin-top:0;" id="qr-modal-name">QR-код</div>
      <div id="qr-canvas-holder" style="display:flex;justify-content:center;margin:14px 0;"></div>
      <div class="hint" id="qr-link-text"></div>
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button class="btn btn--ghost" id="qr-modal-close">Закрыть</button>
        <button class="btn btn--primary" id="qr-modal-download">Скачать PNG</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="admin.js"></script>
</body>
</html>
